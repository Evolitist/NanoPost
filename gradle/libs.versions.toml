hilt-work = "1.2.0"
okhttp = "5.0.0-alpha.14"
ktor = "3.0.0"

# Firebase
firebase = "33.5.1"

# Logging
slf4j = "1.7.36"

junit = "4.13.2"
androidx-benchmark-macro-junit4 = "1.3.3"
