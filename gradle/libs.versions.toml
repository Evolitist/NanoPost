# Core
desugaring = "2.1.2"
kotlin-collections = "0.3.8"
kotlin-datetime = "0.6.1"
kotlin-serialization = "1.7.3"
kmmutils = "1.4.4"

# AndroidX & UI
androidx-activity = "1.9.3"
androidx-appcompat = "1.7.0"
androidx-core = "1.15.0-rc01"
androidx-datastore = "1.1.1"
androidx-lifecycle = "2.9.0-alpha05"
androidx-splashscreen = "1.0.1"
androidx-work = "2.9.1"

# Compose
accompanist = "0.36.0"
compose-blurhash = "1.2"
compose-coil = "3.0.0-rc02"
